name: build

# Run tests, then build linux/amd64 binaries on every branch push / MR (not published).
# On a tag push, run tests then build .deb packages with the version taken from
# the tag (tags look like 2026.06.08-2) and attach them to a GitHub Release.
on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

# Cancel superseded branch/PR runs; never cancel in-progress tag runs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

jobs:
  # ── lint: same image and flags as `make lint`, so local and CI agree ──
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint (golangci-lint, Docker)
        # Pinned image; the Debian variant is required because go-nvml is cgo
        # and the alpine one has no C compiler.
        run: make lint

  # ── commit / MR: build binaries, upload as workflow artifact, do NOT publish ──
  binaries:
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (Docker, linux/amd64)
        # Runs `go test -v -count=1 ./...` inside the build container so tests
        # execute against the same linux/amd64 + CGO/NVML toolchain as the
        # binaries, not the runner host. Fails the job on any test failure.
        run: make docker-test

      - name: Build linux/amd64 binaries (Docker)
        run: make docker-build

      - name: Sign gpu-metrics-exporter (pci-attest)
        id: sign
        # Pull requests run unreviewed code, so they never get the operator's
        # signature (fork PRs get no secrets anyway). Without the secret a
        # branch artifact stays unsigned with a warning; a release refuses.
        if: github.event_name != 'pull_request'
        env:
          ATTEST_SIGNING_KEY: ${{ secrets.ATTEST_SIGNING_KEY }}
        run: |
          if [ -z "$ATTEST_SIGNING_KEY" ]; then
            echo "::warning::ATTEST_SIGNING_KEY secret is not set; the exporter artifact is unsigned"
            exit 0
          fi
          key="$RUNNER_TEMP/attest-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$ATTEST_SIGNING_KEY" > "$key")
          make sign SIGN_KEY="$key"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the pci-attest signature
        # Against the public key the hosts' QEMU is started with (pubkey=),
        # not one derived from the signing key: that is what catches a CI key
        # that does not match the fleet's.
        if: steps.sign.outputs.signed == 'true'
        env:
          ATTEST_PUBLIC_KEY: ${{ secrets.ATTEST_PUBLIC_KEY }}
        run: |
          if [ -z "$ATTEST_PUBLIC_KEY" ]; then
            echo "::warning::ATTEST_PUBLIC_KEY secret is not set; the signature is not verified"
            exit 0
          fi
          pub="$RUNNER_TEMP/attest-public-key"
          printf '%s\n' "$ATTEST_PUBLIC_KEY" > "$pub"
          make verify-signature VERIFY_KEY="$pub"

      - name: Verify binary
        run: |
          file bin/gpu-metrics-exporter bin/gpu-metrics-receiver
          bin/gpu-metrics-receiver -version || true

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ github.sha }}
          path: bin/
          if-no-files-found: error
          retention-days: 14

  # ── tag: build .deb packages with the version from the tag ──
  debs:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    # Only this job publishes; it needs write to create the Release.
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (Docker, linux/amd64)
        # Gate the release on tests passing first, in the same linux/amd64
        # container used to build the .deb packages.
        run: make docker-test

      - name: Build .deb packages
        # make deb runs docker-build (binaries get version via ldflags), signs
        # the exporter for pci-attest with the operator key from the
        # ATTEST_SIGNING_KEY secret (scripts/sign-elf.py), then runs
        # scripts/build-deb.sh, producing dist/<pkg>_<VERSION>_amd64.deb.
        # A release never ships unsigned: the device would ignore every
        # payload from it.
        env:
          ATTEST_SIGNING_KEY: ${{ secrets.ATTEST_SIGNING_KEY }}
        run: |
          if [ -z "$ATTEST_SIGNING_KEY" ]; then
            echo "::error::ATTEST_SIGNING_KEY secret is not set; refusing to release an unsigned exporter"
            exit 1
          fi
          key="$RUNNER_TEMP/attest-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$ATTEST_SIGNING_KEY" > "$key")
          make deb VERSION="${VERSION}" SIGN_KEY="$key"

      - name: Verify the pci-attest signature of the packaged exporter
        # What ships is the binary inside the .deb, so that is the one checked
        # -- against the hosts' public key, before anything is uploaded.
        env:
          ATTEST_PUBLIC_KEY: ${{ secrets.ATTEST_PUBLIC_KEY }}
        run: |
          if [ -z "$ATTEST_PUBLIC_KEY" ]; then
            echo "::error::ATTEST_PUBLIC_KEY secret is not set; refusing to release an unverified exporter"
            exit 1
          fi
          pub="$RUNNER_TEMP/attest-public-key"
          printf '%s\n' "$ATTEST_PUBLIC_KEY" > "$pub"
          root="$RUNNER_TEMP/deb-root"
          dpkg-deb -x "dist/gpu-metrics-exporter_${VERSION}_amd64.deb" "$root"
          make verify-signature VERIFY_KEY="$pub" BIN_DIR="$root/usr/local/bin"

      - name: Inspect packages
        run: |
          ls -la dist/
          for deb in dist/*.deb; do
            echo "::group::$deb"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
            echo "::endgroup::"
          done

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ github.ref_name }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" --title "${VERSION}" --generate-notes --verify-tag dist/*.deb \
            || gh release upload "${VERSION}" dist/*.deb --clobber
